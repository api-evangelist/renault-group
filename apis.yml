aid: renault-group

name: Renault Group

image: https://assets.renaultgroup.com/uploads/2025/06/Logo-RG-yoast.png

description: 'Renault Group is the French automotive group behind the Renault, Dacia, Alpine and Mobilize brands. Its developer
  program, the Renault Group Developer Portal (developer.renaultgroup.com, launched May 2025), targets in-vehicle app development
  on the openR and openR evo infotainment platforms built on Android Automotive OS with Google Automotive Services: an RG
  Android SDK setup guide, public Android Automotive emulators for Renault 5 and Renault Scenic, UX/UI guidelines for driver-distraction-safe
  partner apps, and partner-only Android vehicle properties (onboard vehicle APIs and signals) for the software-defined-vehicle
  platform. No public web/REST API contract is published; vehicle access is onboard via the SDK.'

